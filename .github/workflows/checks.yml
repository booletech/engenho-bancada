name: Verificar calculadoras
on: [push, pull_request]
permissions:
  contents: read
jobs:
  calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check dist/app.js
